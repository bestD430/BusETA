<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港巴士到站時間 ETA Widget (深色模式)</title>
  <style>
    /* 改為深灰色配色方案 */
    :root {
      --bg-color: #121212;         /* 整體頁面底色 (深灰近黑) */
      --card-bg: #1e1e1e;         /* Widget 卡片背景 (中深灰) */
      --group-bg: #2a2a2a;        /* 路線分組背景 (深灰) */
      --modal-bg: #242424;        /* 設定視窗背景 */
      --input-bg: #333333;        /* 輸入框背景 */
      --text-main: #e0e0e0;       /* 主文字顏色 (淺灰/白) */
      --text-sub: #aaaaaa;        /* 次要文字顏色 (淡灰) */
      --border-color: #383838;    /* 邊框顏色 */
      --kmb-red: #e60012;
      --citybus-yellow: #d9a000;
      --mtr-red: #0072ce;
      --eta-green: #4caf50;       /* 深色底適用的綠色 */
      --eta-orange: #ff9800;      /* 深色底適用的橙色 */
      --eta-red: #f44336;         /* 深色底適用的紅色 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    .widget-card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .company-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: bold;
      color: var(--text-main);
    }

    .company-tag {
      padding: 2px 8px;
      border-radius: 4px;
      color: #fff;
      font-size: 12px;
    }

    .tag-kmb { background-color: var(--kmb-red); }
    .tag-citybus { background-color: var(--citybus-yellow); color: #000; font-weight: bold; }
    .tag-mtrbus { background-color: var(--mtr-red); }

    .btn-settings {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      opacity: 0.8;
      transition: opacity 0.2s;
      filter: invert(1); /* 反轉圖示顏色以配合深色底 */
    }

    .btn-settings:hover { opacity: 1; }

    /* 路線卡片組 */
    .route-group {
      background: var(--group-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .route-group:last-child { margin-bottom: 0; }

    .route-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 8px;
    }

    .route-no {
      font-size: 20px;
      font-weight: bold;
      color: #ffffff;
    }

    .route-stop {
      font-size: 13px;
      color: var(--text-sub);
    }

    /* ETA 時間區塊 */
    .first-eta-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px dashed var(--border-color);
      font-weight: bold;
    }

    .first-eta-dest { font-size: 14px; color: #cccccc; }
    .first-eta-time { font-size: 18px; }

    .next-eta-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-sub);
      padding: 4px 0 0 0;
    }

    /* 顏色樣式 */
    .eta-green { color: var(--eta-green); }
    .eta-orange { color: var(--eta-orange); }
    .eta-red { color: var(--eta-red); font-weight: bold; }

    /* 設定選單 Modal */
    .settings-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .settings-modal.active { display: flex; }

    .settings-content {
      background: var(--modal-bg);
      color: var(--text-main);
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      max-height: 85vh;
      overflow-y: auto;
      border: 1px solid var(--border-color);
    }

    .settings-content h3 {
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }

    .config-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--group-bg);
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .config-inputs {
      display: flex;
      gap: 6px;
    }

    .config-inputs input, .config-inputs select {
      padding: 6px 8px;
      background: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 13px;
    }

    .config-inputs input[type="text"] { flex: 1; }

    .btn-group {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }

    .btn {
      padding: 6px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-primary { background: #0d6efd; color: #fff; }
    .btn-secondary { background: #444; color: #ccc; }
  </style>
</head>
<body>

  <!-- 1. 九巴 / 龍運 Widget -->
  <div class="widget-card">
    <div class="widget-header">
      <div class="company-title">
        <span class="company-tag tag-kmb">KMB</span>
        <span>九巴 / 龍運</span>
      </div>
      <button class="btn-settings" onclick="toggleSettings('kmb-settings')">⚙️</button>
    </div>
    <div id="kmb">載入中...</div>
  </div>

  <!-- 2. 城巴 Widget -->
  <div class="widget-card">
    <div class="widget-header">
      <div class="company-title">
        <span class="company-tag tag-citybus">CTB</span>
        <span>城巴</span>
      </div>
      <button class="btn-settings" onclick="toggleSettings('citybus-settings')">⚙️</button>
    </div>
    <div id="citybus">載入中...</div>
  </div>

  <!-- 3. 港鐵巴士 Widget -->
  <div class="widget-card">
    <div class="widget-header">
      <div class="company-title">
        <span class="company-tag tag-mtrbus">MTR</span>
        <span>港鐵巴士</span>
      </div>
      <button class="btn-settings" onclick="toggleSettings('mtrbus-settings')">⚙️</button>
    </div>
    <div id="mtrbus">載入中...</div>
  </div>

  <!-- Modal: 九巴設定 -->
  <div id="kmb-settings" class="settings-modal">
    <div class="settings-content">
      <h3>設定：九巴 / 龍運</h3>
      <div id="kmb-inputs">
        <script>
          for(let i=1; i<=3; i++) {
            document.write(`
              <div class="config-row">
                <label>路線 ${i}</label>
                <div class="config-inputs">
                  <input type="text" id="kmb-route-${i}" placeholder="路線 (如 E31)" style="width: 70px;">
                  <input type="text" id="kmb-stop-${i}" placeholder="車站關鍵字">
                  <select id="kmb-dir-${i}">
                    <option value="outbound">去程</option>
                    <option value="inbound">回程</option>
                  </select>
                </div>
              </div>
            `);
          }
        </script>
      </div>
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="toggleSettings('kmb-settings')">取消</button>
        <button class="btn btn-primary" onclick="saveAndFetchKmb()">儲存</button>
      </div>
    </div>
  </div>

  <!-- Modal: 城巴設定 -->
  <div id="citybus-settings" class="settings-modal">
    <div class="settings-content">
      <h3>設定：城巴</h3>
      <div id="citybus-inputs">
        <script>
          for(let i=1; i<=3; i++) {
            document.write(`
              <div class="config-row">
                <label>路線 ${i}</label>
                <div class="config-inputs">
                  <input type="text" id="citybus-route-${i}" placeholder="路線 (如 E21A)" style="width: 70px;">
                  <input type="text" id="citybus-stop-${i}" placeholder="車站關鍵字">
                  <select id="citybus-dir-${i}">
                    <option value="outbound">去程</option>
                    <option value="inbound">回程</option>
                  </select>
                </div>
              </div>
            `);
          }
        </script>
      </div>
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="toggleSettings('citybus-settings')">取消</button>
        <button class="btn btn-primary" onclick="saveAndFetchCitybus()">儲存</button>
      </div>
    </div>
  </div>

  <!-- Modal: 港鐵巴士設定 -->
  <div id="mtrbus-settings" class="settings-modal">
    <div class="settings-content">
      <h3>設定：港鐵巴士</h3>
      <div id="mtrbus-inputs">
        <script>
          for(let i=1; i<=3; i++) {
            document.write(`
              <div class="config-row">
                <label>路線 ${i}</label>
                <div class="config-inputs">
                  <input type="text" id="mtrbus-route-${i}" placeholder="路線 (如 K51)" style="width: 70px;">
                  <input type="text" id="mtrbus-stop-${i}" placeholder="車站關鍵字">
                  <select id="mtrbus-dir-${i}">
                    <option value="outbound">去程</option>
                    <option value="inbound">回程</option>
                  </select>
                </div>
              </div>
            `);
          }
        </script>
      </div>
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="toggleSettings('mtrbus-settings')">取消</button>
        <button class="btn btn-primary" onclick="saveAndFetchMtrbus()">儲存</button>
      </div>
    </div>
  </div>

  <!-- 通用 Modal 切換邏輯 -->
  <script>
    function toggleSettings(modalId) {
      const modal = document.getElementById(modalId);
      if (modal) {
        modal.classList.toggle('active');
      }
    }
  </script>

  <!-- 載入 JS 檔案 -->
  <script src="kmb.js"></script>
  <script src="citybus.js"></script>
  <script src="mtrbus.js"></script>
</body>
</html>

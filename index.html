<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bus ETA Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 頂部時間與警告標示區 -->
  <div class="header">
    <div id="warning-icon"></div>
    <div id="date"></div>
    <div id="ampm"></div>
    <div id="clock"></div>
  </div>

  <!-- 卡片網格區 -->
  <div class="grid">

    <div class="card">
      <h2>🌤 東涌</h2>
      <div id="tungchung">載入中...</div>
    </div>

    <div class="card">
      <h2>🚌 九巴／龍運</h2>
      <div id="kmb">
        E36A - 2分鐘<br>
        A41 - 5分鐘<br>
        E31 - 8分鐘
      </div>
    </div>

    <div class="card">
      <h2>⛅ 尖沙咀</h2>
      <div id="tst">載入中...</div>
    </div>

    <div class="card">
      <h2>🚌 城巴</h2>
      <div id="citybus">
        A21 - 即將到站<br>
        970 - 4分鐘<br>
        930 - 10分鐘
      </div>
    </div>

    <div class="card">
      <h2>📢 教育局消息</h2>
      <div id="edb-msg">今天沒有特別公布</div>
    </div>

    <div class="card">
      <h2>⚠️ 天文台警告</h2>
      <div id="warning-msg">載入中...</div>
    </div>

  </div>

  <!-- 引入 JS 檔案 -->
  <script src="clock.js"></script>
  <script src="weather.js"></script>
  <script src="warning.js"></script>
</body>
</html>

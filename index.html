<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bus ETA Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 頂部時間與警告標示區 -->
  <div class="header">
    <div id="warning-icon"></div>
    <div id="date"></div>
    <div id="ampm"></div>
    <div id="clock"></div>
  </div>

  <!-- 卡片網格區 -->
  <div class="grid">

    <!-- 東涌天氣 -->
    <div class="card">
      <h2>🌤 東涌</h2>
      <div id="tungchung">載入中...</div>
    </div>

    <!-- 九巴 / 龍運 卡片 (支援 3 條路線) -->
    <div class="card">
      <h2>🚌 九巴／龍運</h2>
      <div class="bus-inputs-group">
        <div class="bus-row">
          <input type="text" id="kmb-route-1" placeholder="路線 1 (例: E31)" value="E31">
          <input type="text" id="kmb-stop-1" placeholder="站名 1 (例: 東涌纜車站)" value="東涌纜車站">
        </div>
        <div class="bus-row">
          <input type="text" id="kmb-route-2" placeholder="路線 2 (例: 37M)" value="37M">
          <input type="text" id="kmb-stop-2" placeholder="站名 2 (例: 迎東邨)" value="迎東邨">
        </div>
        <div class="bus-row">
          <input type="text" id="kmb-route-3" placeholder="路線 3 (選填)" value="">
          <input type="text" id="kmb-stop-3" placeholder="站名 3 (選填)" value="">
        </div>
        <button onclick="saveAndFetchKmb()">更新九巴</button>
      </div>
      <div id="kmb-stop-results"></div>
      <div id="kmb" class="bus-eta-list">載入中...</div>
    </div>

    <!-- 城巴 卡片 (支援 3 條路線) -->
    <div class="card">
      <h2>🚌 城巴</h2>
      <div class="bus-inputs-group">
        <div class="bus-row">
          <input type="text" id="citybus-route-1" placeholder="路線 1 (例: A21)" value="A21">
          <input type="text" id="citybus-stop-1" placeholder="站名 1 (例: 金鐘站)" value="金鐘站">
        </div>
        <div class="bus-row">
          <input type="text" id="citybus-route-2" placeholder="路線 2 (例: E21)" value="">
          <input type="text" id="citybus-stop-2" placeholder="站名 2 (例: 東涌纜車站)" value="">
        </div>
        <div class="bus-row">
          <input type="text" id="citybus-route-3" placeholder="路線 3 (選填)" value="">
          <input type="text" id="citybus-stop-3" placeholder="站名 3 (選填)" value="">
        </div>
        <button onclick="saveAndFetchCitybus()">更新城巴</button>
      </div>
      <div id="citybus" class="bus-eta-list">載入中...</div>
    </div>

    <!-- 教育局消息 -->
    <div class="card">
      <h2>📢 教育局消息</h2>
      <div id="edb-msg">今天沒有特別公布</div>
    </div>

    <!-- 天文台警告 -->
    <div class="card">
      <h2>⚠️ 天文台警告</h2>
      <div id="warning-msg">載入中...</div>
    </div>

  </div>

  <!-- 引入 JS 檔案 -->
  <script src="clock.js"></script>
  <script src="weather.js"></script>
  <script src="kmb.js"></script>
  <script src="citybus.js"></script>
  <script src="warning.js"></script>
</body>
</html>

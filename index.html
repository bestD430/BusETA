<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>巴士到站牌</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="board">
    <div class="header">
      <span class="route-no" id="route">1A</span>
      <span class="destination" id="dest">往 尖沙咀碼頭</span>
    </div>
    
    <div class="eta-list">
      <div class="eta-item">
        <span class="label">下一班</span>
        <span class="time" id="eta1">載入中...</span>
      </div>
      <div class="eta-item">
        <span class="label">第二班</span>
        <span class="time" id="eta2">--</span>
      </div>
      <div class="eta-item">
        <span class="label">第三班</span>
        <span class="time" id="eta3">--</span>
      </div>
    </div>
    <div class="footer" id="update-time">最後更新: --:--:--</div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>

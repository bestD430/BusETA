<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>巴士到站時間儀表板</title>
  <!-- 更新版本號 v=5 強迫瀏覽器重新載入最新 CSS -->
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

  <div class="dashboard-container">
    <!-- 頂部時鐘與天氣面板 -->
    <div class="header">
      <div id="warning-icon"></div>
      <div id="date">--月--日 週-</div>
      <div id="ampm">--</div>
      <div id="clock">00:00</div>
      <div id="weather-info" style="font-size: 12px; margin-top: 4px; color: #555; font-weight: normal;">載入天氣中...</div>
    </div>

    <!-- 內容網格卡片 (適應三卡片佈局) -->
    <div class="grid">
      
      <!-- 1. 九巴 / 龍運 卡片 -->
      <div class="card">
        <div class="card-header">
          <h2>九巴 / 龍運</h2>
          <button class="settings-btn" onclick="toggleSettings('kmb-settings')">⚙️ 設定</button>
        </div>

        <div id="kmb-settings" class="settings-panel hidden">
          <div class="bus-inputs-group">
            <div class="bus-row">
              <input type="text" id="kmb-route-1" placeholder="路線 1 (例: E31)">
              <input type="text" id="kmb-stop-1" placeholder="站名 (例: 雍逸樓)">
              <select id="kmb-dir-1">
                <option value="outbound">去程</option>
                <option value="inbound">回程</option>
              </select>
            </div>
            <div class="bus-row">
              <input type="text" id="kmb-route-2" placeholder="路線 2 (例: E36A)">
              <input type="text" id="kmb-stop-2" placeholder="站名 (例: 雍逸東)">
              <select id="kmb-dir-2">
                <option value="outbound">去程</option>
                <option value="inbound">回程</option>
              </select>
            </div>
            <div class="bus-row">
              <input type="text" id="kmb-route-3" placeholder="路線 3 (例: N31)">
              <input type="text" id="kmb-stop-3" placeholder="站名 (例: 雍逸樓)">
              <select id="kmb-dir-3">
                <option value="outbound">去程</option>
                <option value="inbound">回程</option>
              </select>
            </div>
            <button onclick="saveAndFetchKmb()">儲存並更新</button>
          </div>
        </div>

        <div id="kmb" class="bus-eta-list"></div>
      </div>

      <!-- 2. 城巴 卡片 -->
      <div class="card">
        <div class="card-header">
          <h2>城巴</h2>
          <button class="settings-btn" onclick="toggleSettings('citybus-settings')">⚙️ 設定</button>
        </div>

        <div id="citybus-settings" class="settings-panel hidden">
          <div class="bus-inputs-group">
            <div class="bus-row">
              <input type="text" id="citybus-route-1" placeholder="路線 1 (例: E21A)">
              <input type="text" id="citybus-stop-1" placeholder="站名 (例: 雍逸樓)">
              <select id="citybus-dir-1">
                <option value="outbound">去程</option>
                <option value="inbound">回程</option>
              </select>
            </div>
            <div class="bus-row">
              <input type="text" id="citybus-route-2" placeholder="路線 2 (例: E21B)">
              <input type="text" id="citybus-stop-2" placeholder="站名 (例: 雍逸樓)">
              <select id="citybus-dir-2">
                <option value="outbound">去程</option>
                <option value="inbound">回程</option>
              </select>
            </div>
            <div class="bus-row">
              <input type="text" id="citybus-route-3" placeholder="路線 3 (例: S52)">
              <input type="text" id="citybus-stop-3" placeholder="站名 (例: 逸東邨總站)">
              <select id="citybus-dir-3">
                <option value="outbound">去程</option>
                <option value="inbound">回程</option>
              </select>
            </div>
            <button onclick="saveAndFetchCitybus()">儲存並更新</button>
          </div>
        </div>

        <div id="citybus" class="bus-eta-list"></div>
      </div>

      <!-- 3. 港鐵巴士 卡片 -->
      <div class="card">
        <div class="card-header">
          <h2>港鐵巴士</h2>
          <button class="settings-btn" onclick="toggleSettings('mtrbus-settings')">⚙️ 設定</button>
        </div>

        <div id="mtrbus-settings" class="settings-panel hidden">
          <div class="bus-inputs-group">
            <div class="bus-row">
              <input type="text" id="mtrbus-route-1" placeholder="路線 1 (例: K76)">
              <input type="text" id="mtrbus-stop-1" placeholder="站名 (例: 天恒邨)">
              <select id="mtrbus-dir-1">
                <option value="outbound">去程</option>
                <option value="inbound">回程</option>
              </select>
            </div>
            <div class="bus-row">
              <input type="text" id="mtrbus-route-2" placeholder="路線 2 (例: 506)">
              <input type="text" id="mtrbus-stop-2" placeholder="站名 (例: 屯門站)">
              <select id="mtrbus-dir-2">
                <option value="outbound">去程</option>
                <option value="inbound">回程</option>
              </select>
            </div>
            <div class="bus-row">
              <input type="text" id="mtrbus-route-3" placeholder="路線 3 (例: K52)">
              <input type="text" id="mtrbus-stop-3" placeholder="站名 (例: 屯門站)">
              <select id="mtrbus-dir-3">
                <option value="outbound">去程</option>
                <option value="inbound">回程</option>
              </select>
            </div>
            <button onclick="saveAndFetchMtrbus()">儲存並更新</button>
          </div>
        </div>

        <div id="mtrbus" class="bus-eta-list"></div>
      </div>

    </div>
  </div>

  <!-- 時鐘與天氣預報邏輯 -->
  <script>
    function toggleSettings(panelId) {
      const panel = document.getElementById(panelId);
      if (panel) {
        panel.classList.toggle('hidden');
      }
    }

    function updateClock() {
      const now = new Date();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const weekDays = ["日", "一", "二", "三", "四", "五", "六"];
      const day = weekDays[now.getDay()];

      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';

      hours = hours % 12;
      hours = hours ? hours : 12;
      const hoursStr = String(hours).padStart(2, '0');

      document.getElementById('date').textContent = `${month}月${date}日 週${day}`;
      document.getElementById('ampm').textContent = ampm;
      document.getElementById('clock').textContent = `${hoursStr}:${minutes}`;
    }

    async function fetchWeather() {
      try {
        const res = await fetch("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc");
        const data = await res.json();
        
        const temp = data.temperature?.data[0]?.value || "--";
        const humidity = data.humidity?.data[0]?.value || "--";
        let weatherText = `🌡️ ${temp}°C  💧 ${humidity}%`;
        
        const warningEl = document.getElementById("warning-icon");
        if (data.warningMessage && data.warningMessage.length > 0) {
          warningEl.textContent = "⚠️ " + data.warningMessage[0];
          warningEl.style.display = "block";
        } else {
          warningEl.textContent = "";
          warningEl.style.display = "none";
        }

        document.getElementById("weather-info").textContent = weatherText;
      } catch (e) {
        console.error("取得天氣資料失敗", e);
        document.getElementById("weather-info").textContent = "天氣資料更新失敗";
      }
    }

    setInterval(updateClock, 1000);
    updateClock();

    setInterval(fetchWeather, 600000);
    fetchWeather();
  </script>

  <!-- 載入帶版本號的 JS 檔案 -->
  <script src="kmb.js?v=5"></script>
  <script src="citybus.js?v=5"></script>
  <script src="mtrbus.js?v=5"></script>
</body>
</html>
